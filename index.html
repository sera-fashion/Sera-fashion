<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SERA">
<meta name="theme-color" content="#8c5a3c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>SERA</title>
<style>
:root{--bg:#faf6f1;--card:#fff;--tx:#2a2220;--mu:#8a7d76;--ac:#8c5a3c;--ac2:#f1e6dc;--ok:#2f7d4f;--bad:#b3402f;--bd:#e8ddd3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1715;--card:#26201d;--tx:#f3ebe5;--mu:#a89a91;--ac:#d9a67f;--ac2:#3a2d25;--ok:#6fcf97;--bad:#f08a7a;--bd:#3a312c;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"SF Arabic",Tahoma,sans-serif;font-size:16px;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.w{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:16px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}.b{font-weight:700}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%;min-width:0;margin-bottom:6px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--bg);font-weight:600}
button.g{background:var(--ac2);color:var(--ac)}button.d{background:transparent;color:var(--bad);padding:6px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
label{font-size:12px;color:var(--mu);display:block}
.wk{display:flex;align-items:center;justify-content:space-between;background:var(--ac2);border-radius:12px;padding:6px 10px;margin-bottom:12px}
.wk button{background:transparent;color:var(--ac);font-size:20px;padding:4px 12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:transparent;color:var(--mu);border-radius:0;padding:12px 2px;font-size:12px}nav button.on{color:var(--ac)}
.big{font-size:26px;font-weight:800}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--bd)}.stat:last-child{border:0}
.seg button{background:var(--ac2);color:var(--ac)}.seg button.on{background:var(--ac);color:var(--bg)}
textarea{width:100%;height:70px;font-size:11px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;display:none;z-index:9}
</style>
</head>
<body>
<div id="toast"></div>
<div class="w" id="app"></div>
<nav id="nav"></nav>
<script>
var K='sera_vault',S=null,KEY=null,V={tab:'home',tid:null,w:null,f:{ty:'sold'}};
var te=new TextEncoder(),td=new TextDecoder();
function $(i){return document.getElementById(i)}
function b64(buf){var s='',a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function ub64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function derive(pw,salt){var m=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(o){var iv=crypto.getRandomValues(new Uint8Array(12));var c=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},KEY,te.encode(JSON.stringify(o)));return b64(iv)+'.'+b64(c)}
async function dec(s){var p=s.split('.');var d=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(p[0])},KEY,ub64(p[1]));return JSON.parse(td.decode(d))}
function vault(){try{return JSON.parse(localStorage.getItem(K))}catch(e){return null}}
async function save(){var v=vault();v.data=await enc(S);try{localStorage.setItem(K,JSON.stringify(v))}catch(e){toast('تعذر الحفظ!')}}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},1800)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function n(v){return (Math.round(v*100)/100).toLocaleString('en-US')}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addD(s,k){var d=pd(s);d.setDate(d.getDate()+k);return ymd(d)}
function today(){return ymd(new Date())}
function wk(s){return addD(s,-((pd(s).getDay()+1)%7))}
function wl(w){var f=function(s){var d=pd(s);return d.getDate()+'/'+(d.getMonth()+1)};return f(w)+' ← '+f(addD(w,6))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
V.w=wk(today());
var TY={in:'استلمت',sold:'اتباع',ret:'مرتجع'};

function IT(){var m={};S.traders.forEach(function(t){t.items.forEach(function(i){m[i.id]={i:i,t:t}})});return m}
function stock(iid){var s={in:0,sold:0,ret:0};S.moves.forEach(function(m){if(m.iid===iid)s[m.ty]+=m.q});s.left=s.in-s.sold-s.ret;return s}
function bal(t,end){var o=0,p=0;S.moves.forEach(function(m){if(m.tid===t.id&&m.ty==='sold'&&m.d<=end)o+=m.q*m.c});S.pays.forEach(function(x){if(x.tid===t.id&&x.d<=end)p+=x.a});return o-p}
function agg(){var W={};function g(w){return W[w]=W[w]||{rev:0,cogs:0,exp:0,pcs:0,ret:0}}
  S.moves.forEach(function(m){var o=g(wk(m.d));if(m.ty==='sold'){o.rev+=m.q*m.p;o.cogs+=m.q*m.c;o.pcs+=m.q}else if(m.ty==='ret')o.ret+=m.q});
  S.exp.forEach(function(x){g(wk(x.d)).exp+=x.a});return W}
function wbar(){return '<div class="wk"><button data-a="wk" data-v="1">›</button><div class="b">أسبوع '+wl(V.w)+'</div><button data-a="wk" data-v="-1">‹</button></div>'}

function auth(){
  var v=vault();
  if(!v)return '<h1>أهلاً في SERA</h1><div class="card"><div class="mu">اعمل يوزر وباسوورد. بيتحفظوا على موبايلك بس والبيانات بتتشفر بيهم. <b>لو نسيت الباسوورد مفيش استرجاع.</b></div><br><input id="u" placeholder="اليوزر" autocomplete="username"><input id="p" type="password" placeholder="الباسوورد (6 حروف على الأقل)" autocomplete="new-password"><input id="p2" type="password" placeholder="أكد الباسوورد"><button data-a="setup" style="width:100%">إنشاء</button></div>'+restoreBox();
  return '<h1>SERA 🔒</h1><div class="card"><input id="u" placeholder="اليوزر" autocomplete="username"><input id="p" type="password" placeholder="الباسوورد" autocomplete="current-password"><button data-a="login" style="width:100%">دخول</button></div>'+restoreBox();
}
function restoreBox(){return '<div class="card"><div class="mu">موبايل جديد؟ الصق النسخة الاحتياطية هنا (هتدخل بنفس اليوزر والباسوورد القديمين)</div><textarea id="rb"></textarea><button class="g" data-a="restore" style="width:100%;margin-top:6px">استرجاع</button></div>'}

function home(){
  var W=agg(),c=W[wk(today())]||{rev:0,cogs:0,exp:0,pcs:0,ret:0},net=c.rev-c.cogs-c.exp,owe=0,sp=0,sv=0;
  S.traders.forEach(function(t){owe+=bal(t,'9999');t.items.forEach(function(i){var s=stock(i.id);sp+=s.left;sv+=s.left*i.cost})});
  var h='<h1>SERA</h1><div class="card"><div class="mu">صافي ربح الأسبوع الحالي</div><div class="big '+(net>=0?'ok':'bad')+'">'+n(net)+' ج</div><div class="stat"><span>مبيعات</span><span>'+n(c.rev)+'</span></div><div class="stat"><span>مصروفات</span><span class="bad">'+n(c.exp)+'</span></div><div class="stat"><span>هامش الربح</span><span class="b">'+(c.rev?Math.round(net/c.rev*1000)/10:0)+'%</span></div></div>';
  h+='<div class="card"><div class="stat"><span>مستحق للتجار (كل الأسابيع)</span><span class="b">'+n(owe)+' ج</span></div><div class="stat"><span>قطع عندك</span><span class="b">'+sp+' ('+n(sv)+' ج بسعر الوارد)</span></div></div>';
  h+='<h2>نسخة احتياطية (مشفرة)</h2><div class="card"><div class="mu">احفظها في الملاحظات كل أسبوع.</div><textarea id="bk" readonly>'+esc(localStorage.getItem(K)||'')+'</textarea><div class="two" style="margin-top:6px"><button class="g" data-a="copy">نسخ</button><button class="g" data-a="share">مشاركة</button></div></div><button class="g" data-a="lock" style="width:100%">🔒 قفل التطبيق</button>';
  return h;
}
function traders(){
  var h='<h1>التجار</h1>';
  S.traders.forEach(function(t){var sp=0;t.items.forEach(function(i){sp+=stock(i.id).left});h+='<div class="card" data-a="open" data-v="'+t.id+'"><div class="row"><div class="b">'+esc(t.name)+'</div><div class="b '+(bal(t,'9999')>0?'bad':'')+'">'+n(bal(t,'9999'))+' ج</div></div><div class="mu">مستحق له · عندك '+sp+' قطعة</div></div>'});
  return h+'<div class="card"><div class="row"><input id="tn" placeholder="اسم تاجر جديد" style="margin:0"><button data-a="addT">إضافة</button></div></div>';
}
function trader(){
  var t=S.traders.find(function(x){return x.id===V.tid});if(!t){V.tab='traders';return traders()}
  var w=V.w,we=addD(w,6),im=IT(),owed=0,rev=0,paid=0,rets=[];
  var wm=S.moves.filter(function(m){return m.tid===t.id&&m.d>=w&&m.d<=we});
  wm.forEach(function(m){if(m.ty==='sold'){owed+=m.q*m.c;rev+=m.q*m.p}if(m.ty==='ret'&&im[m.iid])rets.push(m.q+' × '+esc(im[m.iid].i.name))});
  var wp=S.pays.filter(function(x){return x.tid===t.id&&x.d>=w&&x.d<=we});wp.forEach(function(x){paid+=x.a});
  var h='<div class="row"><button class="g" data-a="back">رجوع</button><button class="d" data-a="delT">حذف التاجر</button></div><h1>'+esc(t.name)+'</h1>'+wbar();
  h+='<div class="card"><div class="mu">تقفيل الأسبوع: المطلوب منك (سعر الوارد × المباع)</div><div class="big">'+n(owed)+' ج</div><div class="stat"><span>رصيد قبل الأسبوع</span><span>'+n(bal(t,addD(w,-1)))+'</span></div><div class="stat"><span>اتدفع للتاجر</span><span>'+n(paid)+'</span></div><div class="stat"><span class="b">المتبقي له</span><span class="b bad">'+n(bal(t,we))+' ج</span></div><div class="stat"><span>مرتجع ترجعه له</span><span class="b">'+(rets.length?rets.join('، '):'—')+'</span></div><div class="stat"><span>إيراد البيع / ربحك</span><span>'+n(rev)+' / <b class="ok">'+n(rev-owed)+'</b></span></div></div>';
  h+='<div class="card"><label>تسجيل دفعة للتاجر (بتاريخ النهارده)</label><div class="row"><input id="pa" type="number" inputmode="decimal" placeholder="المبلغ" style="margin:0"><button data-a="pay">دفعت</button></div>'+wp.map(function(x){return '<div class="stat"><span>'+x.d+'</span><span>'+n(x.a)+' <button class="d" data-a="delP" data-v="'+x.id+'">✕</button></span></div>'}).join('')+'</div>';
  h+='<h2>الموديلات والمخزون</h2>';
  t.items.forEach(function(i){var s=stock(i.id);h+='<div class="card"><div class="row"><div class="b">'+esc(i.name)+'</div><button class="d" data-a="delI" data-v="'+i.id+'">حذف</button></div><div class="mu">استلمت '+s.in+' · اتباع '+s.sold+' · مرتجع '+s.ret+' · <b>متبقي '+s.left+'</b></div><div class="two" style="margin-top:6px"><div><label>سعر الوارد</label><input type="number" inputmode="decimal" value="'+i.cost+'" data-f="cost" data-i="'+i.id+'"></div><div><label>سعر البيع</label><input type="number" inputmode="decimal" value="'+i.sell+'" data-f="sell" data-i="'+i.id+'"></div></div></div>'});
  h+='<div class="card"><input id="in" placeholder="موديل جديد"><div class="two"><input id="ic" type="number" inputmode="decimal" placeholder="سعر الوارد"><input id="is" type="number" inputmode="decimal" placeholder="سعر البيع"></div><button data-a="addI" style="width:100%">إضافة الموديل</button></div>';
  h+='<h2>حركات الأسبوع</h2>'+movesList(wm);
  return h;
}
function movesList(l){var im=IT();if(!l.length)return '<div class="card mu">مفيش حركات</div>';
  return l.slice().sort(function(a,b){return a.d<b.d?1:-1}).map(function(m){var x=im[m.iid];return '<div class="card row"><div><div class="b">'+TY[m.ty]+' '+m.q+' × '+(x?esc(x.i.name):'؟')+'</div><div class="mu">'+(x?esc(x.t.name):'')+' · '+m.d+(m.ty==='sold'?' · بـ '+n(m.p):'')+'</div></div><button class="d" data-a="delM" data-v="'+m.id+'">✕</button></div>'}).join('')}
function move(){
  var f=V.f;if(!f.d)f.d=today();if(!f.tid&&S.traders[0])f.tid=S.traders[0].id;
  var t=S.traders.find(function(x){return x.id===f.tid});
  if(!t)return '<h1>حركة</h1><div class="card mu">ضيف تاجر وموديل الأول من تبويب التجار.</div>';
  if(!t.items.some(function(i){return i.id===f.iid}))f.iid=t.items[0]?t.items[0].id:'';
  var h='<h1>تسجيل حركة</h1><div class="card"><label>التاجر</label><select data-f="tid" data-r="1">'+S.traders.map(function(x){return '<option value="'+x.id+'"'+(x.id===f.tid?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'</select><label>الموديل</label><select data-f="iid">'+t.items.map(function(i){return '<option value="'+i.id+'"'+(i.id===f.iid?' selected':'')+'>'+esc(i.name)+'</option>'}).join('')+'</select>';
  h+='<div class="g3 seg" style="margin-bottom:8px">'+['in','sold','ret'].map(function(k){return '<button class="'+(f.ty===k?'on':'')+'" data-a="ty" data-v="'+k+'">'+TY[k]+'</button>'}).join('')+'</div>';
  h+='<div class="two"><div><label>العدد</label><input type="number" inputmode="numeric" data-f="q" value="'+(f.q||'')+'"></div><div><label>التاريخ</label><input type="date" data-f="d" value="'+f.d+'"></div></div>';
  if(f.ty==='sold')h+='<label>سعر البيع (سيبه فاضي = السعر المسجل)</label><input type="number" inputmode="decimal" data-f="p" value="'+(f.p||'')+'">';
  h+='<button data-a="addM" style="width:100%">حفظ الحركة</button></div><h2>آخر الحركات</h2>'+movesList(S.moves.slice(-6));
  return h;
}
function exp(){
  var h='<h1>المصروفات</h1>'+wbar(),w=V.w,we=addD(w,6),l=S.exp.filter(function(x){return x.d>=w&&x.d<=we}),tot=0;l.forEach(function(x){tot+=x.a});
  h+='<div class="card"><div class="mu">إجمالي مصروفات الأسبوع</div><div class="big bad">'+n(tot)+' ج</div></div>';
  l.forEach(function(x){h+='<div class="card row"><div>'+esc(x.t)+'<div class="mu">'+x.d+'</div></div><div><b>'+n(x.a)+'</b> <button class="d" data-a="delE" data-v="'+x.id+'">✕</button></div></div>'});
  return h+'<div class="card"><input id="et" list="el" placeholder="النوع (إعلانات، باكيدج...)"><datalist id="el"><option value="إعلانات"><option value="باكيدج"><option value="شحن"><option value="تصوير"></datalist><div class="two"><input id="ea" type="number" inputmode="decimal" placeholder="المبلغ"><input id="ed" type="date" value="'+(today()>=w&&today()<=we?today():w)+'"></div><button data-a="addE" style="width:100%">إضافة</button></div>';
}
function reports(){
  var W=agg(),ks=Object.keys(W).sort().reverse(),h='<h1>التقارير</h1>';
  if(!ks.length)return h+'<div class="card mu">لسه مفيش أسابيع مسجلة</div>';
  ks.forEach(function(k){var o=W[k],g=o.rev-o.cogs,net=g-o.exp;h+='<div class="card"><div class="b">أسبوع '+wl(k)+'</div><div class="stat"><span>مبيعات ('+o.pcs+' قطعة)</span><span>'+n(o.rev)+'</span></div><div class="stat"><span>تكلفة الوارد للمباع</span><span>'+n(o.cogs)+'</span></div><div class="stat"><span>مجمل الربح</span><span>'+n(g)+'</span></div><div class="stat"><span>مصروفات</span><span class="bad">'+n(o.exp)+'</span></div><div class="stat"><span class="b">صافي الربح</span><span class="b '+(net>=0?'ok':'bad')+'">'+n(net)+' ج ('+(o.rev?Math.round(net/o.rev*1000)/10:0)+'%)</span></div></div>'});
  return h;
}
function render(){
  if(!S){$('app').innerHTML=auth();$('nav').style.display='none';return}
  $('nav').style.display='flex';
  var m={home:home,traders:traders,trader:trader,move:move,exp:exp,reports:reports};
  $('app').innerHTML=m[V.tab]();
  var t=V.tab==='trader'?'traders':V.tab;
  $('nav').innerHTML=[['home','الرئيسية'],['traders','التجار'],['move','＋ حركة'],['exp','مصروفات'],['reports','تقارير']].map(function(x){return '<button class="'+(t===x[0]?'on':'')+'" data-a="tab" data-v="'+x[0]+'">'+x[1]+'</button>'}).join('');
}
function val(i){var e=$(i);return e?e.value.trim():''}
document.addEventListener('click',async function(ev){
  var el=ev.target.closest('[data-a]');if(!el)return;var a=el.dataset.a,v=el.dataset.v,T=S&&S.traders.find(function(x){return x.id===V.tid});
  try{
  if(a==='setup'){var u=val('u'),p=val('p');if(!u||p.length<6||p!==val('p2')){toast('اليوزر مطلوب، والباسوورد 6+ ومتطابق');return}
    var salt=crypto.getRandomValues(new Uint8Array(16));KEY=await derive(p,salt);S={traders:[],moves:[],pays:[],exp:[]};
    try{localStorage.setItem(K,JSON.stringify({u:u.toLowerCase(),salt:b64(salt),data:await enc(S)}))}catch(e){toast('التخزين مش شغال');return}render();return}
  if(a==='login'){var vt=vault();if(val('u').toLowerCase()!==vt.u){toast('اليوزر أو الباسوورد غلط');return}
    try{KEY=await derive(val('p'),ub64(vt.salt));S=await dec(vt.data);S.pays=S.pays||[];render()}catch(e){KEY=null;toast('اليوزر أو الباسوورد غلط')}return}
  if(a==='restore'){try{var d=JSON.parse(val('rb'));if(!d.u||!d.salt||!d.data)throw 0;if(vault()&&!confirm('هيستبدل البيانات الحالية. متأكد؟'))return;localStorage.setItem(K,JSON.stringify(d));S=null;KEY=null;toast('تم. ادخل باليوزر القديم');render()}catch(e){toast('النص مش صالح')}return}
  if(a==='lock'){S=null;KEY=null;render();return}
  if(a==='copy'){var b=$('bk');b.select();b.setSelectionRange(0,999999);try{document.execCommand('copy');toast('تم النسخ')}catch(e){}return}
  if(a==='share'){if(navigator.share)navigator.share({text:localStorage.getItem(K)}).catch(function(){});else toast('استخدم نسخ');return}
  if(a==='tab'){V.tab=v;V.tid=null}
  else if(a==='wk')V.w=addD(V.w,7*(+v));
  else if(a==='open'){V.tab='trader';V.tid=v}
  else if(a==='back'){V.tab='traders';V.tid=null}
  else if(a==='ty'){V.f.ty=v}
  else if(a==='addT'){var nm=val('tn');if(!nm)return;S.traders.push({id:uid(),name:nm,items:[]})}
  else if(a==='delT'){if(!confirm('حذف التاجر وكل حركاته؟'))return;S.moves=S.moves.filter(function(m){return m.tid!==T.id});S.pays=S.pays.filter(function(x){return x.tid!==T.id});S.traders=S.traders.filter(function(x){return x.id!==T.id});V.tab='traders';V.tid=null}
  else if(a==='addI'){var nm=val('in');if(!nm)return;T.items.push({id:uid(),name:nm,cost:+val('ic')||0,sell:+val('is')||0})}
  else if(a==='delI'){if(!confirm('حذف الموديل وحركاته؟'))return;T.items=T.items.filter(function(x){return x.id!==v});S.moves=S.moves.filter(function(m){return m.iid!==v})}
  else if(a==='pay'){var am=+val('pa');if(!am)return;S.pays.push({id:uid(),tid:T.id,d:today(),a:am})}
  else if(a==='delP')S.pays=S.pays.filter(function(x){return x.id!==v});
  else if(a==='delM')S.moves=S.moves.filter(function(x){return x.id!==v});
  else if(a==='addE'){var am=+val('ea');if(!am)return;S.exp.push({id:uid(),d:val('ed')||today(),t:val('et')||'مصروف',a:am})}
  else if(a==='delE')S.exp=S.exp.filter(function(x){return x.id!==v});
  else if(a==='addM'){var f=V.f,x=IT()[f.iid],q=+f.q;if(!x||!(q>0)){toast('اختار الموديل واكتب العدد');return}
    if(f.ty!=='in'&&q>stock(f.iid).left&&!confirm('العدد أكتر من المتبقي عندك. تكمل؟'))return;
    S.moves.push({id:uid(),d:f.d,tid:f.tid,iid:f.iid,ty:f.ty,q:q,c:x.i.cost,p:f.ty==='sold'?(+f.p||x.i.sell):x.i.sell});f.q='';f.p='';toast('تم الحفظ ✓')}
  await save();render();
  }catch(e){toast('حصل خطأ')}
});
document.addEventListener('change',async function(ev){
  var el=ev.target;if(!el.dataset.f||!S)return;var f=el.dataset.f;
  if(el.dataset.i){var T=S.traders.find(function(x){return x.id===V.tid});T.items.find(function(x){return x.id===el.dataset.i})[f]=+el.value||0;await save();render();return}
  V.f[f]=el.value;if(el.dataset.r)render();
});
document.addEventListener('input',function(ev){var el=ev.target;if(el.dataset.f&&!el.dataset.i&&S)V.f[el.dataset.f]=el.value});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
render();
</script>
